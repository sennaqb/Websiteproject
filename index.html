<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bargain Bob's Auto Mart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
/* One look: a dim, buzzing used-car lot. Taxi yellow on asphalt, red for trouble. */
:root{color-scheme:dark;--bg:#0e1217;--panel:#1a212b;--line:#2b3644;--txt:#e8edf2;--dim:#8c9aab;--acc:#ffb81c;--good:#4cc569;--bad:#f0524a;--disp:'Bungee',Impact,'Arial Black',sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
#gl{position:fixed;inset:0;display:block;background:#8f9aa5}
.dim{color:var(--dim);font-size:13px}.good{color:var(--good)}.bad{color:var(--bad)}
h2,h3{margin:0 0 6px}h2{font-size:18px}h3{font-size:16px}
button{font:inherit;color:inherit}
button.b{background:#263445;border:1px solid var(--line);padding:6px 11px;border-radius:7px;cursor:pointer;margin:6px 6px 0 0}
button.b:hover:not(:disabled){border-color:var(--acc)}button.b:disabled{opacity:.4;cursor:not-allowed}
button.go{background:var(--acc);color:#111;font-weight:800;border:0;padding:11px 20px;border-radius:8px;cursor:pointer;font-size:16px;margin-right:8px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=number],input[type=text],input[type=password]{background:#0b0f14;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input[type=number]{width:100px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.row{display:flex;justify-content:space-between;gap:8px}
.bar{height:6px;background:#0b0f14;border-radius:4px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%}
table.sum{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}table.sum td,table.sum th{padding:3px 6px;text-align:left;border-bottom:1px solid var(--line)}

/* HUD */
#hud{display:none}body.playing #hud{display:block}
#hud>*{position:fixed;z-index:4;pointer-events:none;color:#fff;text-shadow:0 1px 3px #000}
#hudTop{top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#000b;padding:6px 14px;border-radius:8px;font-size:14px;text-shadow:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#mini{top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));border:2px solid #fff6;border-radius:6px;background:#000}
#alerts{top:52px;left:max(10px,env(safe-area-inset-left))}.al{background:#c01818d9;margin-bottom:4px;padding:4px 10px;border-radius:6px;font-weight:600;text-shadow:none}
#feed{bottom:max(14px,env(safe-area-inset-bottom));left:max(10px,env(safe-area-inset-left));font-size:14px;max-width:60vw}
#prompt{bottom:28%;left:50%;transform:translateX(-50%);font-size:20px;font-weight:700;background:#000b;padding:6px 14px;border-radius:8px;text-align:center}
#prompt:empty{display:none}
#tip{bottom:max(14px,env(safe-area-inset-bottom));right:max(10px,env(safe-area-inset-right));max-width:340px;background:#000a;padding:8px 12px;border-radius:8px;font-size:14px;border-left:3px solid var(--acc);text-shadow:none}
#cross{top:50%;left:50%;transform:translate(-50%,-50%);font-size:22px;opacity:.7}

/* overlays */
#title,#pc,#pause{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px}
#title{z-index:10;background:linear-gradient(180deg,#000a,#000d)}
#pc{z-index:7;background:#000c}
#pause{z-index:8;background:#000a}
.titlebox{max-width:620px;text-align:left}
.titlebox h1{font:400 clamp(30px,6vw,56px)/1 var(--disp);margin:6px 0 14px;color:var(--acc);letter-spacing:.5px}
.titlebox p{max-width:56ch}
.kicker{text-transform:uppercase;letter-spacing:.2em;font-size:12px;color:var(--dim)}
.btnrow{margin:18px 0}.aibox{margin:10px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0006}
.keys{margin-top:14px;font-size:13px;color:var(--dim);max-width:60ch}.keys b{color:var(--txt)}
#pausetxt{max-width:460px;width:100%;background:var(--panel);padding:20px 24px;border-radius:12px;border:1px solid var(--line);text-align:center;max-height:92vh;overflow:auto}
#pausetxt p{margin:8px 0}
.pcbox{width:min(980px,100%);max-height:94vh;display:flex;flex-direction:column;background:#0b1410;border:2px solid #2e4a3a;border-radius:12px;overflow:hidden;box-shadow:0 0 40px #0008}
.pchead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#102018;border-bottom:1px solid #2e4a3a;color:#8fffb0;font-family:ui-monospace,Menlo,Consolas,monospace}
.pctabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.pctabs .tab{background:var(--panel);border:1px solid var(--line);padding:7px 14px;border-radius:8px;cursor:pointer}
.pctabs .tab.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
.pcbody{padding:14px 16px 20px;overflow:auto}
.flash{margin:10px 16px 0;padding:6px 10px;border-radius:6px;background:#3a1a18;border:1px solid var(--bad);color:#ffb0aa}
.logbox{background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;max-height:200px;overflow:auto}.logbox div{padding:2px 0;border-bottom:1px solid #1a222c}

/* negotiation: subtitles at the bottom, the customer stays in frame */
.modal{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;z-index:9;padding:0 12px max(14px,env(safe-area-inset-bottom));pointer-events:none}
.talk{pointer-events:auto;max-width:780px;width:100%;max-height:56vh;overflow:auto;background:linear-gradient(180deg,#0d1218e0,#080b10f2);border:1px solid #ffffff1f;border-radius:14px;backdrop-filter:blur(6px);box-shadow:0 10px 40px #000a;animation:rise .35s ease-out}
.talk h3{font:400 18px/1.2 var(--disp);color:var(--acc);letter-spacing:.5px}
.tlog{background:transparent;padding:4px 2px;margin:6px 0;height:118px;overflow:auto;font-size:16px;line-height:1.45}
.tlog .c{color:#ffe08a}.tlog .p{color:#cfe3ff}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#card{position:fixed;top:28%;left:0;right:0;text-align:center;z-index:5;pointer-events:none;opacity:0}
#card.show{animation:card 2.4s ease-out forwards}
#card .big{font:400 clamp(40px,8vw,92px)/1 var(--disp);color:var(--acc);text-shadow:0 4px 30px #000c,0 0 2px #000}
#card .small{margin-top:12px;font-size:18px;letter-spacing:.3em;text-transform:uppercase;color:#fff;text-shadow:0 2px 10px #000}
@keyframes card{0%{opacity:0;transform:scale(1.15)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#hudTop{border:1px solid #ffffff1a;backdrop-filter:blur(4px)}
#cross{font-size:0!important;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.8!important;box-shadow:0 0 4px #000}
#subs{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(880px,94vw);z-index:6;text-align:center;pointer-events:none;display:none}
#subs.on{display:block}
#subs .subhead{display:inline-block;background:#000a;padding:4px 12px;border-radius:8px;font-size:13px;color:#dfe6ee;margin-bottom:8px}
#subs .sub{font-size:22px;line-height:1.35;text-shadow:0 2px 6px #000,0 0 2px #000;margin:4px 0}
#subs .sub.c{color:#ffe08a}#subs .sub.s{color:#9fe8a0;font-size:18px}#subs .tag{font-size:14px;opacity:.8;font-weight:400}#subs .sub.p{color:#cfe3ff}#subs .dimmed{opacity:.75;font-size:18px}
#subs .substatus{font-size:15px;color:#fff;text-shadow:0 1px 4px #000;margin:4px 0}
#subs .subsum{display:inline-block;background:#000c;border:1px solid #ffffff22;border-radius:10px;padding:8px 14px;margin:6px 0;font-size:15px}
#subs .subkeys{font-size:13px;color:#cfd6de;text-shadow:0 1px 3px #000;margin-top:6px}
#subs input{pointer-events:auto;width:min(560px,90vw);font-size:16px;padding:8px 12px;margin-top:6px}
body.playing #subs.on~#hud #tip{display:none}
@media (prefers-reduced-motion:reduce){#card.show,.talk{animation:none}#card.show{opacity:1}}
.talk input[type=text]{width:72%}
@media (max-width:640px){#tip{display:none!important}#hudTop{font-size:12px}}
.reviews{display:grid;gap:8px;margin:8px 0;text-align:left}.rev{background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}.rev .st{color:#ffc93a;letter-spacing:1px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"><div id="hudTop"></div><canvas id="mini" width="170" height="170"></canvas><div id="alerts"></div><div id="feed"></div><div id="prompt"></div><div id="tip"></div><div id="cross">+</div></div>
<div id="card"></div>
<div id="subs"></div>
<div id="title"></div>
<div id="pc"></div>
<div id="pause"><div id="pausetxt"></div></div>
<div id="talk"></div>
<script src="lib/three.min.js"></script>
<script src="js/data.js?v=20261020-4"></script>
<script src="js/audio.js?v=20261020-4"></script>
<script src="js/ai.js?v=20261020-4"></script>
<script src="js/whisper.js?v=20261020-4"></script>
<script src="js/lines.js?v=20261020-4"></script>
<script src="js/talk.js?v=20261020-4"></script>
<script src="js/miguel.js?v=20261020-4"></script>
<script src="js/world.js?v=20261020-4"></script>
<script src="js/pc.js?v=20261020-4"></script>
<script src="js/game.js?v=20261020-4"></script>
<script>window.addEventListener("load",function(){Game.boot()});</script>
</body>
</html>
